# Tag -> termos. A tag aparece no app como filtro. As tags em `boost` pesam mais
# no ranking.
tags:
  israel: [israel*, idf, fdi, netanyahu, tel aviv, jerusalém, jerusalem, knesset, mossad]
  gaza: [gaza, hamas, rafah, khan yunis, khan younis, jihad islâmica, islamic jihad]
  cisjordania: [cisjordânia, west bank, jenin, nablus, ramallah, colonos, settler*]
  libano: [líbano, lebanon, lebanese, libanês, libanes*, hezbol*, hizbol*, hizbul*, hezbollah, beirute, beirut]
  ira: [irã, iran*, teerã, tehran, khamenei, guarda revolucionária, revolutionary guard*, irgc]
  iemen: [iêmen, yemen*, houthi*, huthi*, mar vermelho, red sea]
  siria: [síria, sírio*, syria*, damasco, damascus, assad]
  iraque: [iraque, iraqi*, iraq, bagdá, baghdad]
  ucrania_russia: [ucrânia, ucranian*, ukrain*, kiev, kyiv, zelensky*, rússia, russo*, russa*, russia*, putin, kremlin, donbas*, crimeia, crimea]
  sudao: [sudão, sudan*, darfur, cartum, khartoum]
  asia: [taiwan, coreia do norte, north korea*, caxemira, kashmir, myanmar, índia e paquistão, india and pakistan]
  africa: [sahel, mali, burkina faso, níger, somália, somalia, al-shabaab, congo, etiópia, ethiopia, líbia, libya]
  otan: [otan, nato]

boost:
  israel: 1.5
  gaza: 1.4
  cisjordania: 1.3
  libano: 1.3
  ira: 1.3
  iemen: 1.2
  siria: 1.1

# Palavras que marcam urgência no título.
urgent_terms: [urgente, breaking, "última hora", ao vivo agora]
