name: App Android

on:
  push:
    branches-ignore: [gh-pages]
    paths: ["android/**", ".github/workflows/build-android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        working-directory: android
        # Testes de unidade (glossário de tradução etc.) antes de compilar.
        run: ./gradlew testReleaseUnitTest assembleRelease --no-daemon --stacktrace

      - name: Renomear APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Argos-1.0.${WID_VERSION_CODE}.apk"

      # O Obtainium acompanha os Releases deste repositório e atualiza o app sozinho.
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Argos 1.0.${{ github.run_number }}
          body: "Build automática do commit ${{ github.sha }}."
          files: dist/*.apk
          make_latest: true
